<!doctype html><meta charset=utf-8>
<style>
 body{margin:0;padding:24px;background:#0b2b3d;font-family:Georgia,serif}
 .row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-bottom:26px}
 figcaption{color:#9fc2d2;font:12px/1.5 monospace;text-align:center;margin-top:6px}
 .rout{color:#ffd08a}
 .wrap{margin:0}
 .popup{position:relative;display:flow-root;
   width:calc(var(--r)*2);height:calc(var(--r)*2);
   border-radius:50%;background:#f4efe4;color:#123;font-size:19px;line-height:1.35;
   text-align:center;box-sizing:border-box}
 .ex-l,.ex-r{width:50%;height:100%}
 .ex-l{float:left;shape-outside:polygon(100% 0%, 68.78% 2.5%, 56.41% 5%, 47.32% 7.5%, 40% 10%, 33.86% 12.5%, 28.59% 15%, 24.01% 17.5%, 20% 20%, 16.48% 22.5%, 13.4% 25%, 10.7% 27.5%, 8.35% 30%, 6.33% 32.5%, 4.61% 35%, 3.18% 37.5%, 2.02% 40%, 1.13% 42.5%, 0.5% 45%, 0.13% 47.5%, 0% 50%, 0.13% 52.5%, 0.5% 55%, 1.13% 57.5%, 2.02% 60%, 3.18% 62.5%, 4.61% 65%, 6.33% 67.5%, 8.35% 70%, 10.7% 72.5%, 13.4% 75%, 16.48% 77.5%, 20% 80%, 24.01% 82.5%, 28.59% 85%, 33.86% 87.5%, 40% 90%, 47.32% 92.5%, 56.41% 95%, 68.78% 97.5%, 100% 100%, 0% 100%, 0% 0%);shape-margin:1em}
 .ex-r{float:right;shape-outside:polygon(0% 0%, 31.22% 2.5%, 43.59% 5%, 52.68% 7.5%, 60% 10%, 66.14% 12.5%, 71.41% 15%, 75.99% 17.5%, 80% 20%, 83.52% 22.5%, 86.6% 25%, 89.3% 27.5%, 91.65% 30%, 93.67% 32.5%, 95.39% 35%, 96.82% 37.5%, 97.98% 40%, 98.87% 42.5%, 99.5% 45%, 99.87% 47.5%, 100% 50%, 99.87% 52.5%, 99.5% 55%, 98.87% 57.5%, 97.98% 60%, 96.82% 62.5%, 95.39% 65%, 93.67% 67.5%, 91.65% 70%, 89.3% 72.5%, 86.6% 75%, 83.52% 77.5%, 80% 80%, 75.99% 82.5%, 71.41% 85%, 66.14% 87.5%, 60% 90%, 52.68% 92.5%, 43.59% 95%, 31.22% 97.5%, 0% 100%, 0% 100%, 100% 100%, 100% 0%);shape-margin:1em}
 h2{font-size:22px;margin:0 0 .3em}
 p{margin:0}
 .close{margin-top:.5em}
 .close a{color:#1a6a94}
 .popup::after{content:'';position:absolute;inset:0;border-radius:50%;
   border:1px dashed #c33;pointer-events:none}
</style>
<h3 style="color:#cee9f4;font:14px monospace">auto-sized, fill 0.82</h3>
<div class="row">
<figure class="wrap"><div class="popup" data-fill="0.82">
  <div class="ex-l"></div><div class="ex-r"></div>
  <div class="content"><h2>Noise</h2><p>Underwater noise from ships and sonar drowns out the calls whales use to find each other.</p><p class="close"><a href="#">Close</a></p></div>
</div><figcaption>short &middot; <span class="rout"></span></figcaption></figure>
<figure class="wrap"><div class="popup" data-fill="0.82">
  <div class="ex-l"></div><div class="ex-r"></div>
  <div class="content"><h2>Entanglement</h2><p>Ropes and nets from fishing gear can wrap around a whale's tail, flippers or mouth. A whale may tow the gear for months, unable to feed properly, until it starves or drowns.</p><p class="close"><a href="#">Close</a></p></div>
</div><figcaption>medium &middot; <span class="rout"></span></figcaption></figure>
<figure class="wrap"><div class="popup" data-fill="0.82">
  <div class="ex-l"></div><div class="ex-r"></div>
  <div class="content"><h2>Plastic</h2><p>Plastic debris breaks down into fragments that whales swallow while feeding. The pieces fill the stomach without nourishing, and the chemicals they carry build up in the animal's tissue over its whole life. Larger pieces can block the gut entirely, and a whale that cannot digest slowly weakens until it can no longer dive or feed.</p><p class="close"><a href="#">Close</a></p></div>
</div><figcaption>long &middot; <span class="rout"></span></figcaption></figure>
</div>
<h3 style="color:#cee9f4;font:14px monospace">same long copy, fill 0.70 / 0.82 / 0.92</h3>
<div class="row">
<figure class="wrap"><div class="popup" data-fill="0.7">

<script>
// Measure the content height at a candidate radius.
function heightAt(el, c, r) {
  el.style.setProperty('--r', r + 'px');
  c.style.marginTop = '0px';
  return c.getBoundingClientRect().height;
}
for (const el of document.querySelectorAll('.popup')) {
  const c = el.querySelector('.content');
  const fill = parseFloat(el.dataset.fill);
  // Binary search the smallest radius whose wrapped copy still occupies no more
  // than `fill` of the circle's height. Shrinking r narrows every chord, so the
  // content only ever gets taller — the predicate is monotonic and this is safe.
  let lo = 50, hi = 460;
  for (let i = 0; i < 22; i++) {
    const mid = (lo + hi) / 2;
    if (heightAt(el, c, mid) <= fill * 2 * mid) hi = mid; else lo = mid;
  }
  const R = Math.ceil(hi);
  el.style.setProperty('--r', R + 'px');
  // Then the usual centring pass.
  let offset = 0;
  for (let i = 0; i < 8; i++) {
    c.style.marginTop = offset + 'px';
    const h = c.getBoundingClientRect().height;
    const next = Math.max(0, Math.round((2 * R - h) / 2));
    if (next === offset) break;
    offset = next;
  }
  el.closest('.wrap').querySelector('.rout').textContent = 'r=' + R;
}
</script>
